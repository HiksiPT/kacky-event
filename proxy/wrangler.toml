# Deploy from this directory:  npx wrangler deploy
name = "kacky-event-proxy"
main = "src/worker.js"
compatibility_date = "2026-07-01"

[observability]
enabled = true

[observability.logs]
# Invocation logs record every request URL, and leaderboard reads carry the
# player's userToken in the query string. Keep them off.
invocation_logs = false

[vars]
UPSTREAM = "https://vps.kodub.com"
UPSTREAM_ORIGIN = "https://www.kodub.com"

# Scheme + host, no path: the address GitHub Pages serves the site from.
# Every other site gets 403. EDIT THIS before deploying (see README.md).
ALLOWED_ORIGINS = ["https://hiksipt.github.io"]

# Hidden from every board and the standings (not case-sensitive). Most moderation is
# easier from the moderation page (moderate.html), which bans by account, not by name.
BANNED_NICKNAMES = []

# The event is "week 1". Other players' recordings on it are never sent to anyone.
CURRENT_WEEK = 1
EVENT_WEEK = 1

# false: everyone's time and rank are shown (only recordings are private).
HIDE_TIMES = "false"

# Runs uploaded to Kodub some other way than this site (e.g. with an extracted track code)
# are flagged and saved for the moderation page either way.
#   "shadow": the player who drove it still sees it everywhere on the site (their own board,
#             rank, standings), so they think it counted; nobody else sees it or is ranked
#             against it.
#   "public": shown to everyone and counted until you remove it.
OFFSITE_RUNS = "shadow"

# The medal account. Its time sets the Author/Gold/Silver/Bronze medals, and it is left
# out of the overall standings and of every player's rank. Must match
# BENCHMARK_NICKNAME in main.bundle.js.
PUBLIC_NICKNAMES = ["Author Medal"]
# The real Author Medal account's user id (private/author-medal.json). Anyone else who names
# themselves "Author Medal" is hidden, so they can't set the medals or skip the standings.
AUTHOR_USER_IDS = ["ed337cc9b0289331f1748cd3049083c6c24f825bddd2bdf132bb33c2a9b80f68"]

# Runs on the event are stored on Kodub under a secret track id (needs the TRACK_SALT
# secret), so nobody can read them through Kodub or another proxy. Never change it or
# TRACK_SALT once runs exist.
HIDDEN_FROM_WEEK = 1

# The owner (you). tools/owner-key.js prints both values from your profile's private token.
OWNER_KEY_HASHES = ["4950cdc42f1c2754a93ce720eb7a0d43616cf2148ee35f7d039b410416e3d52e"]
# Moderators: can use the moderation page (moderate.html) and nothing else.
# tools/owner-key.js prints this value too (the OWNER_KEY_HASHES line).
MODERATOR_KEY_HASHES = ["5d8f7b8637650e58ed043165cb8370172e3c549b8e386a016151a71b949ab735"]
OWNER_USER_IDS = ["35eb5c466738dc9917d5f8320f5b99f12015247aaf0e512f5e4ecb547f00e0e1"]

